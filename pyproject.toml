[project]
name = "mind-lantern"
version = "0.1.0"
description = "법륜스님 [즉문즉설] 자막 기반 고민 상담 RAG 챗봇"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=6.30.0",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "langchain-pinecone>=0.2.13",
    "pydrive2>=1.21.3",
    "python-dotenv>=1.2.4",
    "requests>=2.32.5",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.12.0",
]
# 보관용 chroma_db/ 조회 (uv sync --group chroma)
chroma = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["chroma_db", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
